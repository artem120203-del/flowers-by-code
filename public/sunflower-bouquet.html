<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Букет подсолнухов — первая проверка</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at 50% 20%, #1d3a24, #08150d 70%);
    font-family: system-ui, sans-serif;
    color: #f2fff5;
    touch-action: none;
  }

  .stage {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    perspective: 1200px;
  }

  .bouquet {
    position: relative;
    width: min(88vw, 420px);
    height: min(78vh, 620px);
    transform-style: preserve-3d;
    transition: transform 0.08s linear;
  }

  .sunflower {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 190px;
    margin-left: -95px;
    filter: drop-shadow(0 22px 30px rgba(0, 0, 0, 0.45));
    user-select: none;
    pointer-events: none;
  }

  .stem {
    position: absolute;
    left: 50%;
    bottom: 8%;
    width: 7px;
    height: 42%;
    margin-left: -3.5px;
    background: linear-gradient(180deg, #4e8b35, #2f5c22);
    border-radius: 8px;
    transform-origin: bottom center;
    box-shadow: 0 12px 24px rgba(0,0,0,0.35);
  }

  .leaf {
    position: absolute;
    bottom: 22%;
    width: 74px;
    height: 34px;
    background: linear-gradient(90deg, #3f7a2c, #66a83f);
    border-radius: 60% 10% 60% 10%;
    box-shadow: 0 10px 18px rgba(0,0,0,0.3);
  }

  .leaf.left {
    left: 50%;
    margin-left: -84px;
    transform: rotate(-24deg);
  }

  .leaf.right {
    left: 50%;
    margin-left: 10px;
    transform: rotate(24deg) scaleX(-1);
  }

  .ui {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    width: min(92vw, 520px);
    padding: 14px 18px;
    border-radius: 18px;
    background: rgba(8, 22, 14, 0.72);
    border: 1px solid rgba(255,255,255,0.12);
    text-align: center;
    font-size: 13px;
    backdrop-filter: blur(14px);
    z-index: 10;
  }

  .title {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 18px;
    font-weight: 700;
    text-shadow: 0 3px 12px rgba(0,0,0,0.5);
    z-index: 10;
  }
</style>
</head>
<body>

<div class="title">Букет подсолнухов</div>

<div class="stage">
  <div class="bouquet" id="bouquet">

    <div class="stem" style="transform: rotate(-18deg);"></div>
    <div class="stem" style="transform: rotate(-9deg);"></div>
    <div class="stem"></div>
    <div class="stem" style="transform: rotate(9deg);"></div>
    <div class="stem" style="transform: rotate(18deg);"></div>

    <div class="leaf left"></div>
    <div class="leaf right"></div>

    <img class="sunflower" src="/sunflower.JPG" alt="Подсолнух"
         style="width: 150px; margin-left: -75px; margin-top: -210px; transform: translateX(-120px) rotate(-18deg);">

    <img class="sunflower" src="/sunflower.JPG" alt="Подсолнух"
         style="width: 160px; margin-left: -80px; margin-top: -230px; transform: translateX(-55px) rotate(-8deg);">

    <img class="sunflower" src="/sunflower.JPG" alt="Подсолнух"
         style="width: 185px; margin-left: -92px; margin-top: -250px; transform: translateY(-10px); z-index: 2;">

    <img class="sunflower" src="/sunflower.JPG" alt="Подсолнух"
         style="width: 160px; margin-left: -80px; margin-top: -230px; transform: translateX(55px) rotate(8deg);">

    <img class="sunflower" src="/sunflower.JPG" alt="Подсолнух"
         style="width: 150px; margin-left: -75px; margin-top: -210px; transform: translateX(120px) rotate(18deg);">

  </div>
</div>

<div class="ui">
  Проведи пальцем влево или вправо, чтобы повернуть букет.
</div>

<script>
  const bouquet = document.getElementById('bouquet');
  let rotationY = 0;
  let rotationX = 0;
  let startX = 0;
  let startY = 0;
  let dragging = false;

  function update() {
    bouquet.style.transform = `rotateY(${rotationY}deg) rotateX(${rotationX}deg)`;
  }

  bouquet.style.transform = 'rotateY(0deg) rotateX(0deg)';

  addEventListener('pointerdown', event => {
    dragging = true;
    startX = event.clientX;
    startY = event.clientY;
  });

  addEventListener('pointermove', event => {
    if (!dragging) return;

    const deltaX = event.clientX - startX;
    const deltaY = event.clientY - startY;

    rotationY += deltaX * 0.35;
    rotationX -= deltaY * 0.12;

    rotationX = Math.max(-18, Math.min(18, rotationX));

    startX = event.clientX;
    startY = event.clientY;
    update();
  });

  addEventListener('pointerup', () => {
    dragging = false;
  });

  addEventListener('pointercancel', () => {
    dragging = false;
  });
</script>

</body>
</html>
