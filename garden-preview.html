<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Волшебный сад — первая проверка</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #07130c; font-family: system-ui, sans-serif; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }

  .ui {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    width: min(92vw, 520px);
    padding: 16px 18px;
    border-radius: 18px;
    background: rgba(8, 22, 14, 0.72);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: #f4fff7;
    text-align: center;
    backdrop-filter: blur(14px);
    z-index: 10;
  }
  .ui h1 {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .ui p {
    font-size: 13px;
    line-height: 1.45;
    color: rgba(244, 255, 247, 0.72);
  }
  .loading {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    color: #d9ffe8;
    font-size: 15px;
    z-index: 20;
    background: #07130c;
    transition: opacity 0.6s ease;
  }
  .loading.hidden {
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="app"></div>
<div class="loading" id="loading">Создаём волшебный сад…</div>

<div class="ui">
  <h1>Первая проверка букета</h1>
  <p>Проведи пальцем, чтобы вращать розу. Сведи или раздвинь пальцы, чтобы приблизить и отдалить.</p>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const app = document.getElementById('app');
const loading = document.getElementById('loading');

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#0a1a10');
scene.fog = new THREE.FogExp2('#0a1a10', 0.055);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 1.35, 3.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.05, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 1.2;
controls.maxDistance = 6;
controls.maxPolarAngle = Math.PI * 0.52;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;

const sun = new THREE.DirectionalLight('#ffe7b8', 2.4);
sun.position.set(3.5, 6, 2.5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
scene.add(sun);

const rimLight = new THREE.DirectionalLight('#8fd8ff', 0.7);
rimLight.position.set(-4, 2.5, -3);
scene.add(rimLight);

const warmFill = new THREE.PointLight('#ffb877', 12, 12, 2);
warmFill.position.set(-1.5, 1.4, 1.8);
scene.add(warmFill);

scene.add(new THREE.HemisphereLight('#b8ffd2', '#1d2a1a', 0.55));

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(14, 64),
  new THREE.MeshStandardMaterial({ color: '#17301d', roughness: 0.95 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const mossMaterial = new THREE.MeshStandardMaterial({ color: '#2c5c33', roughness: 1 });

for (let i = 0; i < 90; i++) {
  const angle = Math.random() * Math.PI * 2;
  const radius = 0.45 + Math.random() * 1.8;
  const moss = new THREE.Mesh(
    new THREE.SphereGeometry(0.035 + Math.random() * 0.07, 6, 5),
    mossMaterial
  );
  moss.position.set(Math.cos(angle) * radius, 0.01 + Math.random() * 0.03, Math.sin(angle) * radius);
  moss.scale.y = 0.35;
  scene.add(moss);
}

const stoneMaterial = new THREE.MeshStandardMaterial({ color: '#53604f', roughness: 0.85 });

for (let i = 0; i < 14; i++) {
  const angle = Math.random() * Math.PI * 2;
  const radius = 1.5 + Math.random() * 3;
  const stone = new THREE.Mesh(
    new THREE.DodecahedronGeometry(0.08 + Math.random() * 0.22, 0),
    stoneMaterial
  );
  stone.position.set(Math.cos(angle) * radius, 0.03, Math.sin(angle) * radius);
  stone.rotation.set(Math.random(), Math.random(), Math.random());
  stone.castShadow = true;
  scene.add(stone);
}

const trunkMaterial = new THREE.MeshStandardMaterial({ color: '#3a2b20', roughness: 0.9 });
const foliageMaterial = new THREE.MeshStandardMaterial({ color: '#1d4a2a', roughness: 0.9 });

for (let i = 0; i < 22; i++) {
  const angle = (i / 22) * Math.PI * 2 + Math.random() * 0.2;
  const radius = 6.5 + Math.random() * 4;
  const height = 3 + Math.random() * 4;

  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.16, height, 7), trunkMaterial);
  trunk.position.set(Math.cos(angle) * radius, height / 2, Math.sin(angle) * radius);
  scene.add(trunk);

  const crown = new THREE.Mesh(new THREE.IcosahedronGeometry(0.9 + Math.random() * 0.8, 1), foliageMaterial);
  crown.position.set(trunk.position.x, height + 0.35, trunk.position.z);
  crown.scale.y = 0.8;
  scene.add(crown);
}

const waterfall = new THREE.Mesh(
  new THREE.PlaneGeometry(2.2, 5.5),
  new THREE.MeshStandardMaterial({
    color: '#a9d8ff',
    transparent: true,
    opacity: 0.28,
    roughness: 0.15
  })
);
waterfall.position.set(-6.5, 2.4, -8);
waterfall.rotation.y = 0.35;
scene.add(waterfall);

const waterfallGlow = new THREE.PointLight('#9fd4ff', 18, 16, 2);
waterfallGlow.position.set(-6.2, 2.2, -7.4);
scene.add(waterfallGlow);

const stem = new THREE.Mesh(
  new THREE.CylinderGeometry(0.022, 0.03, 1.15, 18),
  new THREE.MeshStandardMaterial({ color: '#3f7a35', roughness: 0.62 })
);
stem.position.y = 0.58;
stem.castShadow = true;
scene.add(stem);

function createLeaf() {
  const shape = new THREE.Shape();
  shape.moveTo(0, 0);
  shape.bezierCurveTo(0.16, 0.08, 0.2, 0.35, 0, 0.55);
  shape.bezierCurveTo(-0.2, 0.35, -0.16, 0.08, 0, 0);

  const leaf = new THREE.Mesh(
    new THREE.ShapeGeometry(shape, 24),
    new THREE.MeshStandardMaterial({
      color: '#3d8a3a',
      roughness: 0.55,
      side: THREE.DoubleSide
    })
  );
  leaf.castShadow = true;
  return leaf;
}

[
  { y: 0.38, z: 0.06, rotZ: 0.8 },
  { y: 0.55, z: -0.06, rotZ: -0.9 },
  { y: 0.74, z: 0.05, rotZ: 1.05 }
].forEach((item, index) => {
  const leaf = createLeaf();
  leaf.position.set(0, item.y, item.z);
  leaf.rotation.set(-0.35 + index * 0.08, index * 1.7, item.rotZ);
  leaf.scale.setScalar(1.1 + index * 0.12);
  scene.add(leaf);
});

const petalMaterialOuter = new THREE.MeshPhysicalMaterial({
  color: '#c81f3d',
  roughness: 0.42,
  clearcoat: 0.35,
  clearcoatRoughness: 0.35,
  sheen: 0.7,
  sheenColor: new THREE.Color('#ff8fa3'),
  side: THREE.DoubleSide
});

const petalMaterialInner = new THREE.MeshPhysicalMaterial({
  color: '#e8354f',
  roughness: 0.36,
  clearcoat: 0.45,
  clearcoatRoughness: 0.3,
  sheen: 0.8,
  sheenColor: new THREE.Color('#ffb3c0'),
  side: THREE.DoubleSide
});

function createPetal(material, scale = 1) {
  const shape = new THREE.Shape();
  shape.moveTo(0, 0);
  shape.bezierCurveTo(0.22, 0.04, 0.27, 0.32, 0.08, 0.48);
  shape.bezierCurveTo(0.02, 0.52, -0.02, 0.52, -0.08, 0.48);
  shape.bezierCurveTo(-0.27, 0.32, -0.22, 0.04, 0, 0);

  const petal = new THREE.Mesh(new THREE.ShapeGeometry(shape, 28), material);
  petal.scale.setScalar(scale);
  petal.castShadow = true;
  return petal;
}

const rose = new THREE.Group();
rose.position.y = 1.18;
scene.add(rose);

for (let i = 0; i < 10; i++) {
  const petal = createPetal(petalMaterialOuter, 1.15);
  const angle = (i / 10) * Math.PI * 2;
  petal.position.set(Math.cos(angle) * 0.11, -0.04, Math.sin(angle) * 0.11);
  petal.rotation.set(-0.75 + Math.random() * 0.12, angle, 0.1 + Math.random() * 0.08);
  rose.add(petal);
}

for (let i = 0; i < 8; i++) {
  const petal = createPetal(petalMaterialOuter, 0.92);
  const angle = (i / 8) * Math.PI * 2 + 0.35;
  petal.position.set(Math.cos(angle) * 0.065, 0.015, Math.sin(angle) * 0.065);
  petal.rotation.set(-0.55 + Math.random() * 0.1, angle, 0.08);
  rose.add(petal);
}

for (let i = 0; i < 6; i++) {
  const petal = createPetal(petalMaterialInner, 0.68);
  const angle = (i / 6) * Math.PI * 2 + 0.15;
  petal.position.set(Math.cos(angle) * 0.03, 0.06, Math.sin(angle) * 0.03);
  petal.rotation.set(-0.35 + Math.random() * 0.08, angle, 0.05);
  rose.add(petal);
}

const center = new THREE.Mesh(
  new THREE.SphereGeometry(0.055, 20, 16),
  new THREE.MeshStandardMaterial({ color: '#7c0f22', roughness: 0.5 })
);
center.position.y = 0.07;
rose.add(center);

const pollenCount = 260;
const pollenGeometry = new THREE.BufferGeometry();
const pollenPositions = new Float32Array(pollenCount * 3);

for (let i = 0; i < pollenCount; i++) {
  pollenPositions[i * 3] = (Math.random() - 0.5) * 9;
  pollenPositions[i * 3 + 1] = Math.random() * 4.5;
  pollenPositions[i * 3 + 2] = (Math.random() - 0.5) * 9;
}

pollenGeometry.setAttribute('position', new THREE.BufferAttribute(pollenPositions, 3));

const pollen = new THREE.Points(
  pollenGeometry,
  new THREE.PointsMaterial({ color: '#ffe9a8', size: 0.022, transparent: true, opacity: 0.75, depthWrite: false })
);
scene.add(pollen);

const flyingPetals = [];

for (let i = 0; i < 26; i++) {
  const petal = createPetal(i % 2 === 0 ? petalMaterialOuter : petalMaterialInner, 0.35 + Math.random() * 0.25);
  petal.position.set((Math.random() - 0.5) * 7, 0.3 + Math.random() * 3.5, (Math.random() - 0.5) * 7);
  petal.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
  scene.add(petal);
  flyingPetals.push({ mesh: petal, speed: 0.15 + Math.random() * 0.35, spin: 0.3 + Math.random() * 0.8 });
}

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();

  rose.rotation.y += 0.0015;
  rose.position.y = 1.18 + Math.sin(time * 1.1) * 0.012;
  warmFill.intensity = 11 + Math.sin(time * 1.6) * 1.5;

  const positions = pollen.geometry.attributes.position.array;
  for (let i = 0; i < pollenCount; i++) {
    positions[i * 3 + 1] += 0.0016 + (i % 7) * 0.00018;
    positions[i * 3] += Math.sin(time * 0.5 + i) * 0.0006;
    if (positions[i * 3 + 1] > 4.6) positions[i * 3 + 1] = 0;
  }
  pollen.geometry.attributes.position.needsUpdate = true;

  flyingPetals.forEach((item, index) => {
    item.mesh.position.y -= item.speed * 0.006;
    item.mesh.position.x += Math.sin(time * 0.7 + index) * 0.0012;
    item.mesh.rotation.x += item.spin * 0.004;
    item.mesh.rotation.z += item.spin * 0.003;

    if (item.mesh.position.y < 0.05) {
      item.mesh.position.y = 3.8 + Math.random();
      item.mesh.position.x = (Math.random() - 0.5) * 7;
      item.mesh.position.z = (Math.random() - 0.5) * 7;
    }
  });

  controls.update();
  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

setTimeout(() => loading.classList.add('hidden'), 700);
</script>

</body>
</html>
